[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grade-evidence-certainty-engine"
version = "2.0.0"
description = "GRADE-Master: Autonomous Body of Evidence Certainty & Recommendation Scorer"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
grade-evidence-certainty-engine = "grade_evidence_certainty_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/grade-evidence-certainty-engine"
Repository = "https://github.com/abusuraihsakhri/grade-evidence-certainty-engine.git"
