[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grade-evidence-certainty-engine"
version = "2.0.1"
description = "Reviewer-entered GRADE certainty-of-evidence rating and legacy metric audit tools"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
grade-evidence-certainty-engine = "grade_evidence_certainty_agent.cli:main"
grade-agent-operations = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/grade-evidence-certainty-agent"
Repository = "https://github.com/abusuraihsakhri/grade-evidence-certainty-agent"

[tool.setuptools]
packages = ["agents", "grade_evidence_certainty_agent"]
py-modules = ["cli", "grade_master", "enrichment", "simulator", "grade_master_app", "grade_evidence_certainty_agent_app"]
