name: Python and browser regression tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      AUDIT_SECRET_KEY: ci-test-only-not-for-production-8b7ac32e
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,test]" build
          python -m pip check
      - name: Python checks and tests
        run: |
          python -m compileall -q agents grade_evidence_certainty_agent
          python -m pytest -q
      - name: Browser JavaScript checks and tests
        run: |
          node --check web/app.js
          node --test web/app.test.js
      - name: Build distribution
        run: python -m build
      - name: Verify audit-chain integrity
        run: |
          python - <<'PY'
          from agents.base import AuditTrail
          trail = AuditTrail()
          trail.log("ci", "test", "INTEGRITY", {"count": 1})
          assert trail.verify_integrity()
          trail.logs[0]["payload_hash"] = "modified"
          assert not trail.verify_integrity()
          print("Audit-chain tampering detected")
          PY
